name: Sync upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# `workflows` is a GitHub App/PAT repository permission, not an Actions `permissions` key.
# WORKFLOW_TOKEN must grant contents:write + workflows:write; release access is preflighted
# before any write or published artifact.
# workflow_token_query_error is fail-closed and uploaded with the sync report.

concurrency:
  group: upstream-sync-panel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve official latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: remnawave/panel
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh resolve

      - name: Detect and merge upstream
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/panel.git
          git fetch --no-tags upstream main
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          bash .github/scripts/upstream-sync-lib.sh merge

      - uses: actions/setup-node@v4
        if: steps.sync.outcome == 'success'
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Verify panel current-release contract
        if: steps.sync.outcome == 'success'
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          RELEASE_FILE_PATH: current-release.md
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          bash .github/scripts/upstream-sync-lib.sh release-file
          echo "official_panel_release_tag=${{ steps.release.outputs.tag }} version=${{ steps.release.outputs.version }}"
      - run: npm ci --no-audit --no-fund
        if: steps.sync.outcome == 'success'
      - run: npm run typecheck
        if: steps.sync.outcome == 'success'
      - run: npm run build
        if: steps.sync.outcome == 'success'
      - name: Verify fork documentation
        if: steps.sync.outcome == 'success'
        run: |
          test -f AGENTS.md
          test -f docs/fork/overview.mdx
          test -f docs/fork/upstream-maintenance.mdx

      - name: Verify write capabilities before push
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_CHANGED: ${{ steps.sync.outputs.workflow_changed }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          push_token="$GITHUB_TOKEN"
          if [ "$WORKFLOW_CHANGED" = true ]; then
            test -n "$WORKFLOW_TOKEN" || { echo 'upstream_sync=failed reason=missing_WORKFLOW_TOKEN workflow_files_changed' >&2; exit 1; }
            push_token="$WORKFLOW_TOKEN"
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$push_token" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          bash .github/scripts/upstream-sync-lib.sh preflight

      - name: Resolve final fork commit
        id: source
        if: steps.sync.outcome == 'success'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push tested merge
        if: steps.sync.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_CHANGED: ${{ steps.sync.outputs.workflow_changed }}
        run: |
          set -euo pipefail
          push_token="$GITHUB_TOKEN"
          if [ "$WORKFLOW_CHANGED" = true ]; then
            test -n "$WORKFLOW_TOKEN" || { echo 'upstream_sync=failed reason=missing_WORKFLOW_TOKEN workflow_files_changed' >&2; exit 1; }
            push_token="$WORKFLOW_TOKEN"
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$push_token" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          git push origin HEAD:singbox
      - name: Verify pushed final commit
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/singbox | awk 'NR == 1 { print $1 }')"
          test "$remote_sha" = "$EXPECTED_SHA" || { echo "release_sync=failed reason=remote_branch_not_at_final_commit expected=$EXPECTED_SHA actual=${remote_sha:-missing}" >&2; exit 1; }
      - name: Sync official fork Release
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_CHANGED: ${{ steps.sync.outputs.workflow_changed }}
          FORK_REPO: ${{ github.repository }}
          FORK_COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM_REPO: remnawave/panel
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_RELEASE_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          release_token="$GH_TOKEN"
          if [ "$WORKFLOW_CHANGED" = true ]; then
            test -n "$WORKFLOW_TOKEN" || { echo 'upstream_sync=failed reason=missing_WORKFLOW_TOKEN workflow_files_changed' >&2; exit 1; }
            release_token="$WORKFLOW_TOKEN"
          fi
          GH_TOKEN="$release_token" bash .github/scripts/sync-release.sh sync
      - name: Upload auditable upstream failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync-report.md
          if-no-files-found: warn
